openapi: 3.0.3
info:
  title: Webhook Delivery Platform API
  version: 0.2.0
  description: |
    Webhook deliveries include X-Webhook-Timestamp and X-Webhook-Signature.
    The signature format is v1=<lowercase hex HMAC-SHA256>, over
    `<unix_timestamp>.<exact raw HTTP body>`. Receivers must verify the raw
    body before parsing it and enforce their own replay-protection time window.
paths:
  /v1/bootstrap/organization:
    post:
      summary: One-time bootstrap of an organization and initial API key
      description: Requires X-Bootstrap-Token configured out of band. The returned API key is shown only in this response. The endpoint is permanently closed after success.
      parameters:
        - in: header
          name: X-Bootstrap-Token
          required: true
          schema: {type: string}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, key_name]
              properties:
                name: {type: string, maxLength: 200}
                key_name: {type: string, maxLength: 100}
      responses:
        '201': {description: Organization and one-time API key created}
        '400': {description: Invalid request}
  /v1/organization:
    get:
      summary: Get the authenticated organization
      security: [{bearerAuth: []}]
      responses:
        '200': {description: Organization}
        '401': {description: Unauthorized}
  /v1/api-keys:
    get:
      summary: List organization API keys
      security: [{bearerAuth: []}]
      responses:
        '200': {description: API keys without secrets}
    post:
      summary: Create an API key
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties: {name: {type: string, maxLength: 100}}
      responses:
        '201': {description: API key; secret is returned only once}
  /v1/api-keys/{keyID}:
    delete:
      summary: Revoke an API key
      security: [{bearerAuth: []}]
      parameters: [{in: path, name: keyID, required: true, schema: {type: string, format: uuid}}]
      responses:
        '204': {description: Revoked}
        '404': {description: Not found in this organization}
  /v1/webhook-endpoints:
    get:
      summary: List webhook endpoints
      security: [{bearerAuth: []}]
      responses: {'200': {description: Endpoints without secrets}}
    post:
      summary: Create a webhook endpoint
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [url, secret]
              properties:
                url: {type: string, format: uri, pattern: '^https://'}
                secret: {type: string, minLength: 16, maxLength: 512}
      responses: {'201': {description: Endpoint created}}
  /v1/webhook-endpoints/{endpointID}:
    patch:
      summary: Update a webhook endpoint
      security: [{bearerAuth: []}]
      parameters: [{in: path, name: endpointID, required: true, schema: {type: string, format: uuid}}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                url: {type: string, format: uri, pattern: '^https://'}
                secret: {type: string, minLength: 16, maxLength: 512}
                active: {type: boolean}
      responses: {'200': {description: Endpoint updated}, '404': {description: Not found}}
    delete:
      summary: Delete a webhook endpoint
      security: [{bearerAuth: []}]
      parameters: [{in: path, name: endpointID, required: true, schema: {type: string, format: uuid}}]
      responses: {'204': {description: Deleted}, '404': {description: Not found}}
  /v1/events:
    post:
      summary: Queue an event for delivery
      security: [{bearerAuth: []}]
      parameters:
        - in: header
          name: Idempotency-Key
          required: true
          schema: {type: string}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [type, data]
              properties: {type: {type: string, example: order.created}, data: {type: object}}
      responses: {'202': {description: Event queued}, '400': {description: Invalid request}, '401': {description: Unauthorized}}
  /healthz: {get: {summary: Liveness, responses: {'200': {description: OK}}}}
  /readyz: {get: {summary: Readiness, responses: {'200': {description: Ready}, '503': {description: Not ready}}}}
components:
  securitySchemes:
    bearerAuth: {type: http, scheme: bearer}
