services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: webhook
      POSTGRES_PASSWORD: webhook
      POSTGRES_DB: webhook
    ports: ["5432:5432"]
    volumes: [postgres-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U webhook -d webhook"]
      interval: 5s
      timeout: 5s
      retries: 10
  migrate:
    image: migrate/migrate:v4.18.3
    depends_on:
      postgres: {condition: service_healthy}
    volumes: ["./migrations:/migrations"]
    command: ["-path=/migrations", "-database=postgres://webhook:webhook@postgres:5432/webhook?sslmode=disable", "up"]
  api:
    build: .
    depends_on:
      migrate: {condition: service_completed_successfully}
    environment:
      DATABASE_URL: postgres://webhook:webhook@postgres:5432/webhook?sslmode=disable
      API_KEY_PEPPER: ${API_KEY_PEPPER:?set API_KEY_PEPPER in .env}
      BOOTSTRAP_TOKEN: ${BOOTSTRAP_TOKEN:?set BOOTSTRAP_TOKEN in .env}
      WEBHOOK_ENCRYPTION_KEY: ${WEBHOOK_ENCRYPTION_KEY:?set WEBHOOK_ENCRYPTION_KEY in .env}
      WEBHOOK_LEGACY_SECRET_HEADER: ${WEBHOOK_LEGACY_SECRET_HEADER:-false}
    ports: ["8080:8080"]
volumes:
  postgres-data:
