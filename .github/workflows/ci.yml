name: CI
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env: {POSTGRES_USER: webhook, POSTGRES_PASSWORD: webhook, POSTGRES_DB: webhook}
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U webhook -d webhook"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: {go-version: '1.27.x'}
      - run: go test ./...
      - run: go vet ./...
      - run: go build ./...
